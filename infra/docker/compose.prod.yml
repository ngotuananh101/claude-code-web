# Production deployment: one image, one container, one volume.
#
# Manual deploy from a checkout:
#
#   cp infra/docker/.env.example infra/docker/.env     # fill in the secrets
#   docker compose -f infra/docker/compose.prod.yml up -d --build
#
# Deploy the image CI published instead of building here — use the standalone
# infra/docker/compose.ghcr.yml, which needs no checkout:
#
#   docker compose -f infra/docker/compose.ghcr.yml pull
#   docker compose -f infra/docker/compose.ghcr.yml up -d
#
# Topology (§20.1, §20.3): the image holds Caddy (SPA + reverse proxy) and the
# control server. Only Caddy's port is published, on loopback by default, so an
# existing reverse proxy on this host can terminate TLS. Runners stay
# host-native — they need the operator's Claude config and provider credentials,
# which a container does not have.
#
# The test harness lives in compose.runners.yml and is unrelated to this file.

name: cc-web

services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: cc-web:prod
    restart: unless-stopped
    # CC_WEB_JWT_SECRET and CC_WEB_ALLOWED_ORIGINS come from this file and are
    # required: the server refuses to start without them.
    env_file:
      - .env
    environment:
      CC_WEB_DB: /data/control.sqlite
      CC_WEB_PORT: "8787"
    volumes:
      # Named volume, not a bind mount: the SQLite database (with its WAL and
      # SHM files) is container state and must survive `up --build`.
      - control-data:/data
    # The image's healthcheck probes both processes (control on 8787, Caddy's
    # admin API on 2019), so it is not duplicated here.
    ports:
      # Loopback by default: the host's existing proxy fronts this. Use
      # 0.0.0.0 only for direct LAN access.
      - "${CC_WEB_BIND_ADDR:-127.0.0.1}:${CC_WEB_HTTP_PORT:-8080}:80"

volumes:
  control-data:
