# Production deployment: Control Server + Web behind the operator's TLS proxy.
#
# Manual deploy from a checkout:
#
#   cp infra/docker/.env.example infra/docker/.env     # fill in the secrets
#   docker compose -f infra/docker/compose.prod.yml up -d --build
#
# Topology (§20.1, §20.3): the control server is never published; only the web
# container is, on loopback by default, so an existing reverse proxy on this
# host can terminate TLS. Runners stay host-native — they need the operator's
# Claude config and provider credentials, which a container does not have.
#
# The test harness lives in compose.runners.yml and is unrelated to this file.

name: cc-web

services:
  control:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.control
    image: cc-web-control:prod
    restart: unless-stopped
    # CC_WEB_JWT_SECRET and CC_WEB_ALLOWED_ORIGINS come from this file and are
    # required: the server refuses to start without them.
    env_file:
      - .env
    environment:
      CC_WEB_DB: /data/control.sqlite
      CC_WEB_PORT: "8787"
    volumes:
      # Named volume, not a bind mount: the SQLite database (with its WAL and
      # SHM files) is container state and must survive `up --build`.
      - control-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # No `ports`: the control server is reachable only on the compose network.
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: cc-web-web:prod
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    environment:
      # `:80` keeps Caddy plain-HTTP for an external TLS proxy. A bare domain
      # makes Caddy obtain certificates itself (publish 80/443 in that case).
      CC_WEB_SITE_ADDRESS: ${CC_WEB_SITE_ADDRESS:-:80}
    ports:
      # Loopback by default: the host's existing proxy fronts this. Use
      # 0.0.0.0 only for direct LAN access.
      - "${CC_WEB_BIND_ADDR:-127.0.0.1}:${CC_WEB_HTTP_PORT:-8080}:80"
    networks:
      - internal

volumes:
  control-data:

networks:
  internal:
